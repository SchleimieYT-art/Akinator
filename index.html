<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Akinator HTML</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 540px;
            background: #181818;
            border-radius: 22px;
            padding: 25px;
            box-shadow: 0 0 35px rgba(0,0,0,0.6);
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        #progress {
            color: #aaaaaa;
            margin-bottom: 25px;
        }

        #question {
            font-size: 22px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 14px 22px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #ffffff;
            color: #111111;
        }

        button:hover {
            background: #dddddd;
        }

        #restart {
            margin-top: 20px;
            background: #333333;
            color: white;
        }

        #resultBox {
            display: none;
            margin-top: 20px;
            background: #222222;
            border-radius: 14px;
            padding: 15px;
            text-align: left;
            max-height: 340px;
            overflow-y: auto;
            line-height: 1.5;
            font-size: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .best {
            text-align: center;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .score {
            color: #bbbbbb;
            text-align: center;
            margin-bottom: 20px;
        }

        .other {
            border-top: 1px solid #444;
            padding-top: 10px;
        }

        @media (max-width: 500px) {
            body {
                align-items: flex-start;
                padding: 12px;
            }

            .app {
                padding: 18px;
            }

            h1 {
                font-size: 25px;
            }

            #question {
                font-size: 19px;
            }

            button {
                width: 100%;
            }

            #resultBox {
                max-height: 65vh;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <h1>Akinator HTML</h1>

    <div id="progress">Question 1</div>

    <div id="question"></div>

    <div id="resultBox"></div>

    <div class="buttons" id="buttonBox">
        <button onclick="answerQuestion(true)">Yes</button>
        <button onclick="answerQuestion(false)">No</button>
        <button onclick="dontKnow()">Don't know</button>
    </div>

    <button id="restart" onclick="restartGame()">Restart</button>
</div>

let scores = {};
let currentQuestion = 0;
let gameFinished = false;

const questionEl = document.getElementById("question");
const progressEl = document.getElementById("progress");
const resultBox = document.getElementById("resultBox");

function resetScores() {
    scores = {};
    for (let character of database) {
        scores[character.name] = 0;
    }
}

function updateQuestion() {
    if (currentQuestion >= questions.length) {
        showResult();
        return;
    }

    questionEl.style.display = "flex";
    resultBox.style.display = "none";

    questionEl.textContent = questions[currentQuestion][0];
    progressEl.textContent = `Question ${currentQuestion + 1} / ${questions.length}`;
}

function answerQuestion(userAnswer) {
    if (gameFinished) return;

    const prop = questions[currentQuestion][1];

    for (let character of database) {
        const realValue = character[prop] ?? false;

        if (realValue === userAnswer) {
            scores[character.name] += 2;
        } else {
            scores[character.name] -= 1;
        }
    }

    currentQuestion++;

    if (currentQuestion >= questions.length) {
        showResult();
    } else {
        updateQuestion();
    }
}

function dontKnow() {
    if (gameFinished) return;

    currentQuestion++;

    if (currentQuestion >= questions.length) {
        showResult();
    } else {
        updateQuestion();
    }
}

function showResult() {
    gameFinished = true;

    const sortedScores = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const bestName = sortedScores[0][0];
    const bestScore = sortedScores[0][1];

    let html = `
        <div class="best">I guess your character is:<br><br>${bestName}</div>
        <div class="score">Score: ${bestScore}</div>
        <div class="other"><b>Other possible characters:</b><br><br>
    `;

    for (let i = 1; i < Math.min(25, sortedScores.length); i++) {
        html += `${sortedScores[i][0]} - Score: ${sortedScores[i][1]}<br>`;
    }

    html += `</div>`;

    questionEl.style.display = "none";
    resultBox.style.display = "block";
    resultBox.innerHTML = html;

    progressEl.textContent = "Finished!";
}

function restartGame() {
    currentQuestion = 0;
    gameFinished = false;
    resetScores();
    updateQuestion();
}
